<div class="row">
  <nb-card style="width: 100%">
    <nb-card-body>

      <ngx-title-header title='Import Logs'></ngx-title-header>

      <ngx-table [columns]="cols" [value]="importLogs" (lazyLoad)="loadImportLogsLazy($event)"
        dataKey="id" [totalRecords]="totalRecords" [loading]="loading">
      </ngx-table>
    </nb-card-body>
  </nb-card>
</div>
